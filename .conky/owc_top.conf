-- OWC Conky: CPU/RAM/Prozesse + Laufwerke/Krypto (oben rechts, ueber dem Logo)
dofile(os.getenv('HOME') .. '/.conky/owc_common.lua')

conky.config = owc_config({
    gap_x = 10,
    gap_y = 15,
    minimum_width = 530,
    maximum_width = 530,
    minimum_height = 330,
})

-- Spalte A ab x=5, Spalte B ab x=285, je 240 px breit
conky.text = [[
${voffset 2}${font Orbitron:bold:size=8}${color1}${goto 5}CPU und Speicher${goto 285}Laufwerke${font}
${color3}${goto 5}────────────────────────────────────${goto 285}────────────────────────────────────
${color5}${goto 5}CPU${goto 45}${color2}${cpu cpu0}% @ ${freq_g} GHz${goto 285}${color5}root${goto 345}${color2}${fs_used /}/${fs_size /} ${fs_used_perc /}%
${color1}${goto 5}${cpubar cpu0 6,240}${goto 285}${fs_bar 6,240 /}
${color5}${goto 5}RAM${goto 45}${color2}${mem}/${memmax} ${memperc}%${goto 285}${if_mounted /mnt/Daten}${color5}Daten${goto 345}${color2}${fs_used /mnt/Daten}/${fs_size /mnt/Daten} ${fs_used_perc /mnt/Daten}%${else}${color4}Daten nicht gemountet${endif}
${color1}${goto 5}${membar 6,240}${goto 285}${if_mounted /mnt/Daten}${fs_bar 6,240 /mnt/Daten}${endif}
${color5}${goto 5}Temp${goto 45}${color1}${execi 3 ~/.conky/cpu_temp.sh}${color5}${goto 110}Last${goto 150}${color2}${loadavg}${color1}${goto 285}${diskiograph_read 13,117 1F7A35 3DFF6E}${goto 408}${diskiograph_write 13,117 1F7A35 3DFF6E}
${voffset 5}${color5}${goto 5}Leistung${goto 70}${color1}${execi 3 ~/.conky/power_ryzen.sh}${color5}${goto 140}Prozesse${goto 205}${color2}${processes}${goto 285}${color5}Lesen ${color2}${diskio_read}/s${goto 408}${color5}Schr. ${color2}${diskio_write}/s

${font Orbitron:bold:size=8}${color1}${goto 5}Top-Prozesse${font}${color4}${goto 165}CPU%${goto 205}MEM%${font Orbitron:bold:size=8}${color1}${goto 285}Krypto in EUR${font}${color4}${goto 435}24 h
${color3}${goto 5}────────────────────────────────────${goto 285}────────────────────────────────────
${color2}${goto 5}${top name 1}${goto 160}${top cpu 1}${goto 200}${top mem 1}${goto 285}${color5}BTC${goto 345}${execpi 60 python3 ~/.conky/price.py BTC}
${color2}${goto 5}${top name 2}${goto 160}${top cpu 2}${goto 200}${top mem 2}${goto 285}${color5}XRP${goto 345}${execpi 60 python3 ~/.conky/price.py XRP}
${color5}${goto 5}${top name 3}${goto 160}${top cpu 3}${goto 200}${top mem 3}${goto 285}${color5}DOGE${goto 345}${execpi 60 python3 ~/.conky/price.py DOGE}
${color5}${goto 5}${top name 4}${goto 160}${top cpu 4}${goto 200}${top mem 4}${goto 285}${color5}LTC${goto 345}${execpi 60 python3 ~/.conky/price.py LTC}
${color4}${goto 5}${top name 5}${goto 160}${top cpu 5}${goto 200}${top mem 5}${goto 285}${color5}PEPE${goto 345}${execpi 60 python3 ~/.conky/price.py PEPE}
]]
