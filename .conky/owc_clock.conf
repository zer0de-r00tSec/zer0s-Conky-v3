-- OWC Conky: Uhr + System (oben links neben den Infos, ueber dem Logo)
dofile(os.getenv('HOME') .. '/.conky/owc_common.lua')

conky.config = owc_config({
    -- Position: rechter Bildschirmrand minus gap_x
    gap_x = 555,
    gap_y = 15,
    minimum_width = 240,
    maximum_width = 240,
    minimum_height = 330,
})

conky.text = [[
${image /home/zer0/.conky/logo.png -p 2,6 -s 44x44}${image /home/zer0/.conky/logo.png -p 194,6 -s 44x44}\
${font Orbitron:size=7}${color4}${alignc}OWC Power${font}
${font Orbitron:bold:size=22}${color1}${alignc}${time %H:%M}${font}
${voffset 10}${font Orbitron:size=10}${color2}${alignc}${time %e. %B %Y}${font}
${font Orbitron:size=8}${color5}${alignc}${time %A}${font}
${voffset 4}${font Orbitron:size=7}${color4}${alignc}One Szene One Board One Crew${font}

${font Orbitron:bold:size=8}${color1}System${font}
${color3}────────────────────────────────────
