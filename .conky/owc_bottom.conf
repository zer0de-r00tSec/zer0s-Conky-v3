-- OWC Conky: Spotify + LAN + Dia-Show (unter dem Logo)
dofile(os.getenv('HOME') .. '/.conky/owc_common.lua')

conky.config = owc_config({
    gap_x = 10,
    gap_y = 805,   -- so tief wie moeglich ueber der Taskleiste (ca. y=1045)
    minimum_width = 810,
    maximum_width = 810,
    minimum_height = 225,
})

-- Spalten: Spotify x=10, LAN x=285, Dia-Show x=560
conky.text = [[
${execi 300 ~/.conky/diashow.sh}${image /dev/shm/current.png -p 560,34 -s 240x180 -n}\
${if_running spotify}${execi 5 ~/.conky/spotify.sh cover}${image /dev/shm/spotify_cover.jpg -p 10,34 -s 100x100 -n}${endif}\
${voffset 2}${font Orbitron:bold:size=8}${color1}${goto 10}Spotify${goto 285}1 GBit LAN ${font}${color4}eno1${font Orbitron:bold:size=8}${color1}${goto 560}Dia-Show${font}
${color3}${goto 10}────────────────────────────────────${goto 285}────────────────────────────────────${goto 560}────────────────────────────────────
${if_running spotify}${color5}${goto 120}Artist${else}${color4}${goto 10}Spotify ist geschlossen${endif}${goto 285}${color5}↓ ${color2}${downspeed eno1}${goto 408}${color5}↑ ${color2}${upspeed eno1}
${if_running spotify}${color2}${goto 120}${execi 3 ~/.conky/spotify.sh artist}${endif}${color1}${goto 285}${downspeedgraph eno1 24,117 1F7A35 3DFF6E}${goto 408}${upspeedgraph eno1 24,117 1F7A35 3DFF6E}
${if_running spotify}${color5}${goto 120}Titel${endif}${color4}${goto 285}Σ ${totaldown eno1}${goto 408}Σ ${totalup eno1}
${if_running spotify}${color2}${goto 120}${execi 3 ~/.conky/spotify.sh title}${endif}
${font Orbitron:bold:size=8}${color1}${goto 285}10 GBit LAN ${font}${color4}enp5s0f1${font}
${if_running spotify}${color5}${goto 120}Album${endif}${color3}${goto 285}────────────────────────────────────
${if_running spotify}${color2}${goto 120}${execi 3 ~/.conky/spotify.sh album}${endif}${color5}${goto 285}↓ ${color2}${downspeed enp5s0f1}${goto 408}${color5}↑ ${color2}${upspeed enp5s0f1}
${color1}${goto 285}${downspeedgraph enp5s0f1 24,117 1F7A35 3DFF6E}${goto 408}${upspeedgraph enp5s0f1 24,117 1F7A35 3DFF6E}
${color4}${goto 285}Σ ${totaldown enp5s0f1}${goto 408}Σ ${totalup enp5s0f1}
]]
